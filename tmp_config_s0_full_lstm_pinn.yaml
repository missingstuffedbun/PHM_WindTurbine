loss:
  data_weight: 1.0
  physics_weight: 0.1
metrics:
- rmse
- mae
- mape
- r2
model:
  backbone: lstm
  dropout: 0.1
  hidden_dim: 128
  input_dim: 37
  num_layers: 3
  output_dim: 3
  use_pinn: true
paths:
  figures_dir: results/figures
  metrics_dir: results/metrics
  model_dir: results/models
  processed_dir: data/processed
  raw_dir: data/raw
  results_dir: results
preprocessing:
  stride: 10
  target_signals:
  - TMBNS
  - TMBEW
  - TMBTOR
  test_ratio: 0.15
  train_ratio: 0.7
  val_ratio: 0.15
  window_size: 100
scenarios:
  s0_full:
    description: 所有选定传感器可用
    name: full_monitoring
    observable_ratio: 1.0
  s1_medium:
    description: 中等程度稀疏，减少部分结构监测信息
    name: medium_sparse
    observable_ratio: 0.7
  s2_severe:
    description: 严重稀疏，进一步减少结构监测信息
    name: severe_sparse
    observable_ratio: 0.4
  s3_tower_failure:
    blocked_signals:
    - TMBNS
    - TMBEW
    - TMBTOR
    description: 塔底结构传感器失效
    name: tower_sensor_failure
  s4_nacelle_failure:
    blocked_signals:
    - NAX1
    - NAX2
    - NAY1
    - NAY2
    - NAZ1
    - NAZ2
    description: 机舱传感器失效
    name: nacelle_sensor_failure
  s5_rotor_failure:
    blocked_signals:
    - XTurbSpeed1
    - TurbSpeed2
    - RST2
    description: 转子传感器失效
    name: rotor_sensor_failure
seed: 42
training:
  batch_size: 64
  device: cpu
  early_stopping_patience: 10
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
