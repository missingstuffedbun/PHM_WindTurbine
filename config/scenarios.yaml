# 稀疏监测场景策略定义
# 每个场景包含：name, description, observable_ratio, blocked_signals

s0_full:
  name: "full_monitoring"
  description: "所有选定传感器可用"
  observable_ratio: 1.0

s1_medium:
  name: "medium_sparse"
  description: "中等程度稀疏，减少部分结构监测信息"
  observable_ratio: 0.7

s2_severe:
  name: "severe_sparse"
  description: "严重稀疏，进一步减少结构监测信息"
  observable_ratio: 0.4

s3_tower_failure:
  name: "tower_sensor_failure"
  description: "塔底结构传感器失效"
  blocked_signals:
    - "TMBNS"
    - "TMBEW"
    - "TMBTOR"

s4_nacelle_failure:
  name: "nacelle_sensor_failure"
  description: "机舱传感器失效"
  blocked_signals:
    - "NAX1"
    - "NAX2"
    - "NAY1"
    - "NAY2"
    - "NAZ1"
    - "NAZ2"

s5_rotor_failure:
  name: "rotor_sensor_failure"
  description: "转子传感器失效"
  blocked_signals:
    - "XTurbSpeed1"
    - "TurbSpeed2"
    - "RST2"
