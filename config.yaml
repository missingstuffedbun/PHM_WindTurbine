# 数据路径
paths:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  results_dir: "results"
  model_dir: "results/models"
  metrics_dir: "results/metrics"
  figures_dir: "results/figures"

# 数据预处理
preprocessing:
  target_signals:
    - "TMBNS"
    - "TMBEW"
    - "TMBTOR"

  window_size: 100
  stride: 10
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15

# 稀疏监测场景
# 场景策略定义在 config/scenarios.yaml 中，这里只需列出要运行的场景名称。
scenarios:
  - "s0_full"
  - "s1_medium"
  - "s2_severe"
  - "s3_tower_failure"
  - "s4_nacelle_failure"
  - "s5_rotor_failure"

# 模型配置
# 支持单个值或列表；列表会自动展开为笛卡尔积组合进行批量实验。
model:
  backbone: ["lstm", "transformer", "mlp"]  # 可选: lstm, transformer, mlp
  use_pinn: [false, true]                     # 是否启用物理约束
  input_dim: 37
  output_dim: 3
  hidden_dim: 128
  num_layers: 3
  dropout: 0.1

# 训练配置
training:
  batch_size: 64
  epochs: 100
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 10
  device: "cpu"  # 可选: cuda, cpu

# 损失函数权重
loss:
  data_weight: 1.0
  physics_weight: 0.5       # 自适应：实际权重会随 data_loss/phys_loss 动态缩放
  adaptive_physics: true    # true=数据越充足物理约束自动退场，避免干扰已拟合模型

# 评价指标
metrics:
  - "rmse"
  - "mae"
  - "mape"
  - "r2"

# 随机种子
seed: 42
